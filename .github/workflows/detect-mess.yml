name: Vue Mess Detector

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    detect-mess:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            -   uses: actions/checkout@v4

            -   name: Install package manager (from package.json)
                run: |
                    corepack enable
                    corepack install

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22.x
                    cache: yarn

            -   run: yarn install

            -   name: Analyze Vue code
                uses: brenoepics/vmd-action@v0.0.7
                with:
                    skipInstall: 'true'
                    packageManager: yarn
                    srcDir: ./
                    relativeMode: 'false'
                    commentsEnabled: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
