name: E2E Tests

on: pull_request

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Install package manager (from package.json)
                run: |
                    corepack enable
                    corepack install

            -   uses: actions/setup-node@v4
                with:
                    node-version: lts/*
                    cache: yarn

            -   run: yarn install
            -   run: yarn build
            -   run: npx playwright install --with-deps && yarn e2e:test

            -   uses: actions/upload-artifact@v4
                if: ${{ !cancelled() }}
                with:
                    name: playwright-report
                    path: playwright-report/
                    retention-days: 30
